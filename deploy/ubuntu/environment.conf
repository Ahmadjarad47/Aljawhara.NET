[Service]
Environment=PLAYWRIGHT_BROWSERS_PATH=/opt/aljawhara-playwright
Environment=HOME=/var/lib/aljawhara
Environment=XDG_CONFIG_HOME=/var/lib/aljawhara/.config
Environment=XDG_CACHE_HOME=/var/lib/aljawhara/.cache
StateDirectory=aljawhara
StateDirectoryMode=0700
EnvironmentFile=/etc/aljawhara/aljawhara.env
UMask=0077
ReadWritePaths=/var/backups/aljawhara /var/log/aljawhara
LogsDirectory=aljawhara
LogsDirectoryMode=0700
