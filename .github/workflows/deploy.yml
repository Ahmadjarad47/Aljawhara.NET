name: Auto Deploy Aljawhara.NET

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: aljawhara-production-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: |
          sudo python3 tests/deployment_release_smoke.py
          dotnet test tests/Ecom.AIShopping.Tests/Ecom.AIShopping.Tests.csproj -c Release
          dotnet test tests/Ecom.AIShopping.SecurityTests/Ecom.AIShopping.SecurityTests.csproj -c Release
          dotnet test tests/Ecom.CheckoutAudit.Tests/Ecom.CheckoutAudit.Tests.csproj -c Release --filter FullyQualifiedName~ProductionSeedingTests
          cd Ecom.API
          dotnet publish -c Release -o publish
          # Secrets/configuration are retained on the server by activate-release.sh.
          find publish -maxdepth 1 -name 'appsettings*.json' -delete

      - name: Upload and activate verified release
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          command -v rsync >/dev/null
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 0600 "$key_file"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          unset SSH_PRIVATE_KEY
          ssh_options=(-i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/deploy/ubuntu/known_hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="/var/www/Aljawhara.NET/incoming/$GITHUB_SHA"
          ssh "${ssh_options[@]}" root@72.61.187.165 "install -d -m 0755 '$target'"
          printf -v remote_shell '%q ' ssh "${ssh_options[@]}"
          rsync -a -e "$remote_shell" Ecom.API/publish/ "root@72.61.187.165:$target/"
          ssh "${ssh_options[@]}" root@72.61.187.165 "bash '$target/deploy/activate-release.sh' '$GITHUB_SHA'"
